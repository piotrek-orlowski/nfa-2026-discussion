<script>
// Click-driven zoom into a static figure. Author markup:
//
//   ::: {.figure-zoom data-extent="W H"}
//   ![](figure.svg)
//
//   []{.zoom-step .fragment data-view="x0 y0 x1 y1"}
//   []{.zoom-step .fragment data-view="x0 y0 x1 y1" data-keep="x0 y0 x1 y1; x0 y0 x1 y1"}
//   :::
//
// Coordinates are the figure's own units, origin at the bottom left (matplotlib data
// coordinates for trs_market.svg). The latest visible step sets the view, fitted and
// centred in the frame; data-keep washes out everything outside its rectangles.
// Back and slide re-entry recompute from the fragments' state.
(() => {
  const SVG = 'http://www.w3.org/2000/svg'
  const IDENTITY = 'translate(0%, 0%) scale(1)'
  const numbers = text => text.trim().split(/[\s,]+/).map(Number)
  const rects = text => (text || '').split(';').filter(part => part.trim()).map(numbers)
  const zooms = new Map()

  function rect(x, y, width, height, fill) {
    const node = document.createElementNS(SVG, 'rect')
    for (const [key, value] of Object.entries({ x, y, width, height, fill })) node.setAttribute(key, value)
    return node
  }

  function build(stage, serial) {
    const [W, H] = numbers(stage.dataset.extent)
    const img = stage.querySelector('img')
    const holder = img.parentElement
    const canvas = document.createElement('div')
    canvas.className = 'zoom-canvas'
    canvas.style.transform = IDENTITY
    canvas.append(img)
    if (holder !== stage && !holder.textContent.trim() && !holder.children.length) holder.remove()

    const id = `figure-zoom-mask-${serial}`
    const dim = document.createElementNS(SVG, 'svg')
    dim.setAttribute('class', 'zoom-dim')
    dim.setAttribute('viewBox', `0 0 ${W} ${H}`)
    dim.setAttribute('preserveAspectRatio', 'none')
    dim.setAttribute('aria-hidden', 'true')
    const mask = document.createElementNS(SVG, 'mask')
    mask.id = id
    mask.setAttribute('maskUnits', 'userSpaceOnUse')
    const wash = rect(0, 0, W, H, '')
    wash.removeAttribute('fill')
    wash.setAttribute('mask', `url(#${id})`)
    dim.append(mask, wash)
    canvas.append(dim)

    stage.prepend(canvas)
    stage.style.setProperty('--zoom-aspect', `${W} / ${H}`)
    zooms.set(stage, { stage, canvas, dim, mask, W, H })
  }

  function transform({ W, H }, view) {
    if (!view) return IDENTITY
    const [x0, y0, x1, y1] = view
    const scale = 1 / Math.max((x1 - x0) / W, (y1 - y0) / H)
    // Centre the view, but never pull an edge of the figure inside the frame.
    const shift = centre => Math.min(0, Math.max(1 - scale, 0.5 - scale * centre))
    const tx = shift((x0 + x1) / 2 / W)
    const ty = shift(1 - (y0 + y1) / 2 / H)
    return `translate(${tx * 100}%, ${ty * 100}%) scale(${scale})`
  }

  function apply(zoom) {
    const visible = [...zoom.stage.querySelectorAll('.zoom-step.visible')]
    const step = visible.reduce((latest, el) =>
      !latest || Number(el.dataset.fragmentIndex) >= Number(latest.dataset.fragmentIndex) ? el : latest, null)
    zoom.canvas.style.transform = transform(zoom, step?.dataset.view && numbers(step.dataset.view))
    const keep = rects(step?.dataset.keep)
    // Leave the old mask in place while the wash fades out.
    if (keep.length) {
      zoom.mask.replaceChildren(rect(0, 0, zoom.W, zoom.H, 'white'),
        ...keep.map(([x0, y0, x1, y1]) => rect(x0, zoom.H - y1, x1 - x0, y1 - y0, 'black')))
    }
    zoom.dim.classList.toggle('is-on', keep.length > 0)
  }

  function update() {
    const slide = window.Reveal.getCurrentSlide()
    for (const zoom of zooms.values()) if (slide?.contains(zoom.stage)) apply(zoom)
  }

  function start() {
    document.querySelectorAll('.reveal .figure-zoom').forEach((stage, i) => build(stage, i))
    const deck = window.Reveal
    for (const event of ['fragmentshown', 'fragmenthidden', 'slidechanged']) deck.on(event, update)
    if (deck.isReady()) update()
    else deck.on('ready', update)
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start, { once: true })
  else start()
})()
</script>
