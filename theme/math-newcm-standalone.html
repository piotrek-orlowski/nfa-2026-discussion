<script>
window.MathJax = {
  loader: {
    paths: {
      'mathjax-newcm': 'vendor/mathjax-fonts/mathjax-newcm-font'
    }
  },
  svg: {
    dynamicPrefix: 'vendor/mathjax-fonts/mathjax-newcm-font/svg/dynamic'
  },
  tex: {
    inlineMath: [['\\(', '\\)']],
    displayMath: [['\\[', '\\]']],
    processEscapes: false,
    packages: {'[-]': ['autoload']},
    // The directory build retains MathJax's HTML extension and colored class
    // spans. The one-file backup keeps the enclosed mathematics but does not
    // dynamically request that extension.
    macros: {
      class: ['#2', 2],
      mathbb: ['\\mathbf{#1}', 1],
      mathcal: ['\\mathit{#1}', 1],
      boldsymbol: ['\\mathbf{#1}', 1]
    }
  },
  options: {
    enableMenu: false,
    enableExplorer: false,
    enableSpeech: false,
    enableBraille: false,
    enableEnrichment: false,
    enableComplexity: false,
    a11y: {
      speech: false,
      braille: false,
      keyMagnifier: false,
      mouseMagnifier: false,
      subtitles: false,
      viewBraille: false
    }
  },
  startup: {
    ready() {
      MathJax.startup.defaultReady();
      // MathJax 4's combined component installs accessibility document
      // defaults after reading the top-level options. Override the constructed
      // document before pageReady/typesetting so it never starts the SRE worker.
      Object.assign(MathJax.startup.document.options, {
        enableMenu: false,
        enableExplorer: false,
        enableSpeech: false,
        enableBraille: false,
        enableEnrichment: false,
        enableComplexity: false
      });
    },
    pageReady() {
      return MathJax.startup.defaultPageReady().then(() => {
        const remoteResources = performance.getEntriesByType('resource')
          .map(entry => entry.name)
          .filter(name => /^https?:\/\//i.test(name) && new URL(name).origin !== location.origin);
        if (remoteResources.length) {
          throw new Error(`offline runtime fetched external resources: ${remoteResources.join(', ')}`);
        }
        document.documentElement.dataset.offlineRuntime = 'pass';
        if (window.Reveal) {
          if (Reveal.isReady()) Reveal.layout();
          else Reveal.on('ready', () => Reveal.layout());
        }
      });
    }
  }
};
</script>
